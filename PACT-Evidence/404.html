<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Page Not Found — PACT</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >

  <style>
    .error-page {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .error-box {
      width: 100%;
      max-width: 680px;
    }

    .error-code {
      font-size: clamp(72px, 15vw, 150px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin: 0 0 20px;
    }

    .error-box h1 {
      margin-bottom: 14px;
    }

    .error-box p {
      max-width: 560px;
      margin: 0 auto 28px;
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">

      <a
        href="./index.html"
        class="brand"
        aria-label="PACT Home"
      >
        PACT
      </a>

      <div class="navlinks">
        <a href="./index.html">Home</a>
        <a href="./create.html">Create Record</a>
        <a href="./verify.html">Verify</a>
        <a href="./profile.html">Profile</a>
      </div>

    </div>
  </nav>


  <!-- 404 Content -->
  <main class="error-page">

    <div class="error-box">

      <div class="error-code">
        404
      </div>

      <div class="badge">
        PAGE NOT FOUND
      </div>

      <h1>
        This page doesn't exist.
      </h1>

      <p class="muted">
        The page you're looking for may have been moved,
        removed, or the address may be incorrect.
      </p>

      <div class="button-row">

        <a
          href="./index.html"
          class="btn btn-primary"
        >
          Back to Home
        </a>

        <a
          href="./verify.html"
          class="btn btn-ghost"
        >
          Verify a Record
        </a>

      </div>

    </div>

  </main>


  <!-- Footer -->
  <footer class="footer">

    <div class="container footer-inner">

      <div>
        <strong>PACT</strong>

        <p>
          Record Today. Prove Tomorrow.
        </p>
      </div>

      <div class="footer-links">

        <a href="./privacy.html">
          Privacy
        </a>

        <a href="./terms.html">
          Terms
        </a>

        <a href="./disclaimer.html">
          Disclaimer
        </a>

      </div>

    </div>
  </footer>

</body>
</html>
